<style>
.gw{max-width:1040px;margin:0 auto;padding:18px 20px 60px;
  font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;color:#0a1628}
.gw h2{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.gw .lead{font-size:12.5px;color:#7a8794;margin:0 0 16px;line-height:1.7}

.gtabs{display:flex;gap:2px;border-bottom:1px solid #dde5ea;margin-bottom:18px;
  overflow-x:auto}
.gtab{padding:9px 15px;font-size:12.5px;color:#7a8794;cursor:pointer;
  white-space:nowrap;background:none;border:none;
  border-bottom:2px solid transparent;font-family:inherit}
.gtab:hover{color:#0a1628}
.gtab.on{color:#0a1628;border-bottom-color:#3d8460;font-weight:600}
.gpane{display:none}.gpane.on{display:block}

.gform{background:#f7f9fa;border:1px solid #dde5ea;border-radius:10px;
  padding:14px;margin-bottom:18px}
.gform h4{font-size:12.5px;margin:0 0 10px}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.ginp,.gsel{padding:7px 10px;border:1px solid #dde5ea;border-radius:7px;
  font-size:12.5px;font-family:inherit}
.gbtn{background:#0a1628;color:#fff;border:none;padding:7px 15px;
  border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;
  white-space:nowrap}
.gbtn:hover{background:#123047}
.gbtn.gh{background:none;border:1px solid #dde5ea;color:#0a1628;
  padding:5px 11px;font-size:11.5px}
.gbtn.gh:hover{background:#f0f4f6}
.gbtn.mn{background:#3d8460}.gbtn.mn:hover{background:#2f6b4d}
.gbtn.ng{background:#dc2626}

.gtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.gtbl th{text-align:left;font-size:11px;color:#7a8794;padding:7px 9px;
  border-bottom:1px solid #dde5ea;white-space:nowrap}
.gtbl td{padding:8px 9px;border-bottom:1px solid #eef3f5;vertical-align:middle}
.gtbl tr:hover td{background:#fafcfd}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
  color:#7a8794}
.tg{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:700}
.tg.on{background:#d1fae5;color:#046c4e}
.tg.off{background:#e5e7eb;color:#4b5563}
.tg.free{background:#dbeafe;color:#1e40af}
.tg.paid{background:#fef3c7;color:#92400e}
.gempty{padding:26px 0;text-align:center;color:#9aa8b2;font-size:12.5px}

/* ---- ファイル編集 ---- */
.fide{display:flex;gap:11px;align-items:flex-start}
.flist{width:200px;flex:none;background:#fff;border:1px solid #dde5ea;
  border-radius:10px;padding:10px;max-height:520px;overflow-y:auto}
.fitem{padding:6px 9px;border-radius:6px;font-size:11.5px;cursor:pointer;
  font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.fitem:hover{background:#f0f4f6}
.fitem.on{background:#0a1628;color:#fff}
.fitem .sz{float:right;opacity:.5;font-size:10px}
.fedit{flex:1;min-width:0}
.fhd{background:#0a1628;color:#cfe3ea;padding:6px 11px;
  border-radius:9px 9px 0 0;font-size:11.5px;display:flex;
  align-items:center;gap:7px;font-family:ui-monospace,monospace}
.fhd .sp{flex:1}
.fhd .gbtn{padding:3px 9px;font-size:10.5px;background:none;
  border:1px solid #2a4360;color:#cfe3ea}
.fcode{width:100%;min-height:440px;padding:11px;border:1px solid #dde5ea;
  border-top:none;border-radius:0 0 9px 9px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  line-height:1.6;resize:vertical}
.fcode:focus{outline:none}

/* ---- AIプロンプト ---- */
.prompt{background:#0a1628;color:#cfe3ea;border-radius:10px;padding:16px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.75;white-space:pre-wrap;max-height:460px;overflow:auto}
.pnote{background:#eefcff;border:1px solid #b8e8f2;border-radius:9px;
  padding:11px 14px;font-size:11.5px;color:#1a5966;line-height:1.75;
  margin-bottom:14px}
</style>

<div class="gw">
  <h2>🎮 Omame Group Games</h2>
  <p class="lead">毎月 無料1・有料2 の 公式ゲームを 出します。
    ファイルは <span class="mono">static/games/&lt;slug&gt;/</span> に 入ります。</p>

  <div class="gtabs">
    <button class="gtab on" data-p="list">📋 ゲーム</button>
    <button class="gtab" data-p="edit">✏️ ファイル</button>
    <button class="gtab" data-p="item">🎁 中のもの</button>
    <button class="gtab" data-p="ai">🤖 AIに たのむ</button>
  </div>

  <!-- ゲーム一覧 -->
  <div class="gpane on" id="g-list">
    <div class="gform">
      <h4>＋ ゲームを つくる／なおす</h4>
      <div class="grow">
        <input class="ginp" id="gSlug" placeholder="slug（英小文字）"
          style="max-width:150px">
        <input class="ginp" id="gTitle" placeholder="だいめい"
          style="flex:1;min-width:150px">
        <input class="ginp" id="gIcon" placeholder="🎮" maxlength="4"
          style="max-width:58px">
      </div>
      <div class="grow">
        <input class="ginp" id="gSummary" placeholder="せつめい"
          style="flex:1;min-width:200px">
        <input class="ginp" id="gPrice" type="number" value="0"
          placeholder="PT" style="max-width:90px" title="0 なら 無料">
        <input class="ginp" id="gMonth" placeholder="2026-10"
          style="max-width:110px">
        <button class="gbtn mn" onclick="saveGame()">ほぞん</button>
      </div>
      <div id="gMsg" style="font-size:12px"></div>
    </div>
    <div id="gameList"></div>
  </div>

  <!-- ファイル編集 -->
  <div class="gpane" id="g-edit">
    <div class="grow">
      <select class="gsel" id="edGame" onchange="loadFiles()"
        style="min-width:180px"></select>
      <button class="gbtn gh" onclick="newFile()">＋ ファイル</button>
      <span id="edSize" style="font-size:11.5px;color:#7a8794"></span>
      <span class="sp" style="flex:1"></span>
      <a id="edPlay" class="gbtn gh" href="#" target="_blank">▶ ためす</a>
    </div>
    <div class="fide">
      <div class="flist" id="fList"></div>
      <div class="fedit">
        <div class="fhd"><span id="fPath">—</span><span class="sp"></span>
          <button class="gbtn" onclick="saveFile()">ほぞん (Ctrl+S)</button>
          <button class="gbtn" onclick="delFile()">けす</button></div>
        <textarea class="fcode" id="fCode" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- アイテム -->
  <div class="gpane" id="g-item">
    <div class="gform">
      <h4>＋ ゲームの 中で 売る もの</h4>
      <div class="grow">
        <select class="gsel" id="itGame" style="min-width:160px"></select>
        <input class="ginp" id="itCode" placeholder="code（英小文字）"
          style="max-width:140px">
        <input class="ginp" id="itName" placeholder="なまえ"
          style="flex:1;min-width:130px">
        <input class="ginp" id="itPrice" type="number" value="50"
          style="max-width:80px">
      </div>
      <div class="grow">
        <input class="ginp" id="itSummary" placeholder="せつめい"
          style="flex:1;min-width:200px">
        <button class="gbtn mn" onclick="saveItem()">ほぞん</button>
      </div>
      <div id="itMsg" style="font-size:12px"></div>
    </div>
    <div class="pnote">
      ゲームの 中では <span class="mono">omame.has('code')</span> で
      もっているか しらべ、<span class="mono">omame.buy('code')</span> で
      買わせます。
    </div>
  </div>

  <!-- AIプロンプト -->
  <div class="gpane" id="g-ai">
    <div class="pnote">
      ほかの AI（ChatGPT / Gemini / Claude など）に ゲームを つくって もらう
      ときは、下の 文を そのまま わたして ください。
      <b>「ためす」で うごきを たしかめてから 公開</b> しましょう。
    </div>
    <div class="grow">
      <button class="gbtn mn" onclick="copyPrompt()">📋 コピー</button>
      <select class="gsel" id="pKind" onchange="drawPrompt()">
        <option value="ff">🆓 無料ゲーム × アイテム無料</option>
        <option value="fp">🆓 無料ゲーム × アイテム有料（PT）</option>
        <option value="pf">🫘 有料ゲーム × アイテム無料</option>
        <option value="pp">🫘 有料ゲーム × アイテム有料（PT）</option>
        <option value="short">✏️ つづきを たのむ とき</option>
      </select>
    </div>
    <div class="prompt" id="promptBox"></div>
  </div>
</div>

<script>
(function(){
var GAMES = [], CURF = null, CURG = null;
var K = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;'); };
function T(m,t){ if(window.toast) window.toast(m,t); else alert(m); }
async function J(u,o){ var r=await fetch(u,o);
  return await r.json().catch(function(){
    return {ok:false,error:'こたえを よめません'}; }); }
function P(u,b){ return J(u,{method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(b||{})}); }
function $(i){ return document.getElementById(i); }

/* ---- ゲーム一覧 ---- */
async function load(){
  var d = await J('/api/admin/games');
  if (d.ok !== true){
    $('gameList').innerHTML = '<div class="gempty">' + K(d.error) + '</div>';
    return;
  }
  GAMES = d.games;
  $('gameList').innerHTML = GAMES.length
    ? '<div style="overflow-x:auto"><table class="gtbl"><thead><tr>'
      + '<th>ゲーム</th><th>ねだん</th><th>月</th><th>もっている人</th>'
      + '<th>ファイル</th><th>▶</th><th>状態</th><th></th></tr></thead><tbody>'
      + GAMES.map(function(g){
          return '<tr><td>' + K(g.icon || '🎮') + ' <b>' + K(g.title) + '</b>'
            + '<div class="mono">/oma_games/' + K(g.slug) + '</div></td>'
            + '<td>' + (g.price > 0
                ? '<span class="tg paid">' + g.price + ' PT</span>'
                : '<span class="tg free">むりょう</span>') + '</td>'
            + '<td class="mono">' + K(g.month || '—') + '</td>'
            + '<td>' + g.owners + '</td>'
            + '<td>' + g.files + '</td>'
            + '<td>' + (g.plays || 0) + '</td>'
            + '<td><span class="tg ' + (g.active ? 'on' : 'off') + '">'
            + (g.active ? '出てる' : '止めた') + '</span></td>'
            + '<td><button class="gbtn gh" onclick="pickGame(\'' + K(g.slug)
            + '\')">なおす</button> '
            + '<a class="gbtn gh" href="/oma_games/' + K(g.slug)
            + '" target="_blank">見る</a></td></tr>';
        }).join('') + '</tbody></table></div>'
    : '<div class="gempty">まだ ゲームが ありません</div>';

  var opts = GAMES.map(function(g){
    return '<option value="' + K(g.slug) + '">' + K(g.icon || '🎮') + ' '
      + K(g.title) + '</option>'; }).join('');
  $('edGame').innerHTML = opts;
  $('itGame').innerHTML = opts;
  if (GAMES.length && !CURG){ CURG = GAMES[0].slug; loadFiles(); }
}

window.saveGame = async function(){
  var m = $('gMsg');
  var r = await P('/api/admin/game', {
    slug: $('gSlug').value.trim().toLowerCase(),
    title: $('gTitle').value.trim(),
    summary: $('gSummary').value,
    price: parseInt($('gPrice').value) || 0,
    month: $('gMonth').value.trim(),
    icon: $('gIcon').value.trim()});
  if (r.ok !== true){ m.style.color='#c0453b'; m.textContent = r.error; return; }
  m.style.color='#046c4e';
  m.textContent = 'ほぞんしました。ファイルの タブで 中身を 書いて ください';
  $('gSlug').value = ''; $('gTitle').value = ''; $('gSummary').value = '';
  load();
};

window.pickGame = function(slug){
  var g = GAMES.filter(function(x){ return x.slug === slug; })[0];
  if (!g) return;
  $('gSlug').value = g.slug; $('gTitle').value = g.title;
  $('gSummary').value = g.summary || ''; $('gPrice').value = g.price;
  $('gMonth').value = g.month || ''; $('gIcon').value = g.icon || '';
  window.scrollTo(0, 0);
};

/* ---- ファイル ---- */
window.loadFiles = async function(){
  CURG = $('edGame').value;
  if (!CURG) return;
  $('edPlay').href = '/oma_games/' + CURG + '/play';
  var d = await J('/api/admin/game/' + CURG + '/files');
  if (d.ok !== true) return;
  $('edSize').textContent = Math.round(d.total / 1024) + ' KB / '
    + Math.round(d.max / 1024) + ' KB';
  $('fList').innerHTML = d.files.length
    ? d.files.map(function(f){
        return '<div class="fitem' + (f.path === CURF ? ' on' : '') + '" '
          + 'onclick="openFile(\'' + K(f.path) + '\')">' + K(f.path)
          + '<span class="sz">' + Math.round(f.size / 100) / 10 + 'k</span>'
          + '</div>'; }).join('')
    : '<div class="gempty" style="padding:14px 0">ファイルが ありません</div>';
  if (!CURF && d.files.length) openFile(d.files[0].path);
};

window.openFile = async function(path){
  var d = await J('/api/admin/game/' + CURG + '/file?path='
    + encodeURIComponent(path));
  if (d.ok !== true){ T(d.error, 'error'); return; }
  CURF = path;
  $('fPath').textContent = path;
  $('fCode').value = d.content;
  loadFiles();
};

window.saveFile = async function(){
  if (!CURF) return;
  var r = await P('/api/admin/game/' + CURG + '/file',
    {path: CURF, content: $('fCode').value});
  if (r.ok !== true){ T(r.error, 'error'); return; }
  T('ほぞんしました');
  loadFiles();
};

window.newFile = function(){
  var p = prompt('ファイルの 名前\n\n例: index.html / script.js / lib/util.js');
  if (!p) return;
  CURF = p.trim();
  $('fPath').textContent = CURF;
  $('fCode').value = '';
};

window.delFile = async function(){
  if (!CURF || !confirm(CURF + ' を けしますか？')) return;
  await fetch('/api/admin/game/' + CURG + '/file?path='
    + encodeURIComponent(CURF), {method:'DELETE'});
  CURF = null; $('fCode').value = ''; $('fPath').textContent = '—';
  loadFiles();
};

document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    if ($('g-edit').classList.contains('on')) saveFile();
  }
});

/* ---- アイテム ---- */
window.saveItem = async function(){
  var m = $('itMsg');
  var r = await P('/api/admin/game/' + $('itGame').value + '/item', {
    code: $('itCode').value.trim().toLowerCase(),
    name: $('itName').value.trim(),
    summary: $('itSummary').value,
    price: parseInt($('itPrice').value) || 0});
  if (r.ok !== true){ m.style.color='#c0453b'; m.textContent = r.error; return; }
  m.style.color='#046c4e'; m.textContent = 'ほぞんしました';
  $('itCode').value = ''; $('itName').value = ''; $('itSummary').value = '';
  load();
};

/* ---- AIプロンプト ---- */
var P_FULL = [
'Omame Group Games の ゲームを 作って ください。',
'',
'【どんな ばしょか】',
'小学生〜中学生が つかう プログラミング学習サイト「Omame PJ」の 中に ある、',
'公式ゲームの コーナーです。毎月 3つ ゲームが 出ます。',
'あそぶ 人は アカウントを もって いて、記録は サーバーに のこります。',
'べつの パソコンや スマホで 開いても、つづきから あそべます。',
'ゲームを あそぶ ために サイトの ポイント（PT）を つかう ことも あります。',
'',
'【どんな ゲームが よろこばれるか】',
'・すぐ はじめられて、1回 3分くらいで おわる',
'・でも 何回も やりたく なる（ハイスコアや つづきが ある）',
'・スマホでも パソコンでも 同じように あそべる',
'・見た目が きれいで、うごきが きもちいい',
'・子どもが コードを 読んで「こう 作るのか」と 学べる',
'',
'━━━━━━━━━━━━━━━━━━━━',
'',
'【1. 画面の こと】',
'',
'ゲームは iframe の 中で うごきます。上に 運営の バーが あります。',
'',
'  ┌──────────────────────────┐',
'  │ 🎮 ゲーム名      🫘 120 PT  ⛶全画面  ←もどる │ ← 運営の バー',
'  ├──────────────────────────┤',
'  │                                          │',
'  │        ここが ゲームの 画面              │',
'  │                                          │',
'  └──────────────────────────┘',
'',
'・だいめい・PT・もどるボタンは バーに あるので、ゲームの 中で 作らない。',
'・つかえる 大きさ：',
'    パソコン  よこ 約1000px / たて 約600px',
'    スマホ    よこ 約360px  / たて 約550px',
'・スクロールしないで 収まる ように 作って ください。',
'  （body に overflow:hidden; height:100%; を おすすめ します）',
'・したじの 色は 自由です。上の バーは こい みどり（#1c2e24）です。',
'',
'【2. ファイルの こと】',
'',
'  index.html   ← 1まいだけ。ほかの HTML は 作れません',
'  style.css',
'  script.js',
'',
'この 3つ だけです。画面を きりかえたい ときは、',
'JavaScript で 見せたり かくしたり して ください。',
'',
'index.html は こう 書きはじめて ください：',
'',
'  <!DOCTYPE html>',
'  <html lang="ja">',
'  <head>',
'  <meta charset="UTF-8">',
'  <meta name="viewport" content="width=device-width, initial-scale=1.0">',
'  <title>ゲームの なまえ</title>',
'  <scr' + 'ipt src="/static/games/omame.js"></scr' + 'ipt>   ← かならず 先に',
'  <link rel="stylesheet" href="style.css">',
'  </head>',
'  <body>',
'    ...',
'  <scr' + 'ipt src="script.js"></scr' + 'ipt>',
'  </body>',
'  </html>',
'',
'【3. セーブの しかた】',
'',
'localStorage は つかえません（iframe の 中なので エラーに なります）。',
'かわりに omame という しくみを つかいます。これで ぜんぶです：',
'',
'  omame.ready.then(function(data){',
'      // ここが さいしょに 1回 よばれます',
'      // data = まえの セーブデータ（はじめては {}）',
'      high = omame.getScore("high");',
'      stage = data.stage || 1;',
'      hajimeru();',
'  });',
'',
'  omame.getScore("キー")        // よみだす。なければ 0',
'  omame.setScore("キー", 点)    // まえより 大きい ときだけ のこる',
'                                //   のこったら true が かえる',
'  omame.save({stage:5, coin:9}) // すきな データを のこす',
'  omame.data                    // いまの セーブデータ',
'',
'たいせつな こと：',
'・かならず omame.ready.then の 中で ゲームを はじめて ください。',
'  それより 前に よむと、まだ データが 来て いません。',
'・セーブは しっぱいする ことも あります。',
'  のこらなくても ゲームが 止まらない ように 作って ください。',
'',
'【4. つかえない もの】  ← ここが いちばん だいじ',
'',
'この 3つは よく まちがえられます。ぜったいに つかわないで ください：',
'',
'  ✗ Tailwind CSS（cdn.tailwindcss.com）',
'  ✗ Bootstrap・jQuery・React など 外の ライブラリ',
'  ✗ Google Fonts',
'',
'  → CSS は ぜんぶ 自分で style.css に 書いて ください。',
'    外の サイトから 読みこむ ものは 1つも つかえません。',
'',
'また、omame の 代わりを 自分で 作らないで ください。',
'  ✗ if (typeof window.omame === "undefined") { ... }',
'  → サイトの がわで 用意して あるので、そのまま つかえます。',
'',
'そのほか つかえない もの：',
'',
'  ✗ CDN（外の ライブラリ）',
'  ✗ 外の 画像・音の ファイル',
'  ✗ localStorage / sessionStorage',
'  ✗ fetch で よその サイトへ',
'  ✗ 2まいめの HTML',
'',
'【5. つかえる もの】',
'',
'  ○ canvas（絵を かく）',
'  ○ 絵文字 🐍🍎⭐（画像の かわりに つかえます）',
'  ○ CSS の animation / gradient / box-shadow',
'  ○ SVG（コードの 中に 直接 書く）',
'  ○ Web Audio API（音を 自分で 作る）',
'  ○ requestAnimationFrame',
'',
