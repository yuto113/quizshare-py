<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理センター — Qzero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  background:#14213d;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;color:#fff}
.box{background:#fff;color:#14213d;border-radius:18px;padding:36px 32px;
  max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.logo{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.logo span{color:#b8860b}
.sub{font-size:12px;color:#a09a8a;text-align:center;margin-bottom:28px}
label{font-size:12px;color:#8a8270;display:block;margin:14px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid #e0dcd0;border-radius:10px;
  font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:#b8860b}
button{width:100%;padding:13px;margin-top:22px;background:#14213d;color:#fff;
  border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  font-family:inherit}
button:hover{background:#1c2d52}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;text-align:center;margin-top:14px;min-height:20px}
.links{margin-top:24px;padding-top:20px;border-top:1px solid #f0ede5;
  font-size:12px;color:#a09a8a;text-align:center;line-height:2}
.links a{color:#b8860b;text-decoration:none}
</style></head><body>
<div class="box">
  <div class="logo">Qzero <span>管理センター</span></div>
  <div class="sub">社員IDでログインしてください</div>

  <label>社員ID</label>
  <input id="sid" autocomplete="username" autofocus>
  <label>パスワード</label>
  <input id="pw" type="password" autocomplete="current-password"
    onkeydown="if(event.key==='Enter')doLogin()">
  <button id="btn" onclick="doLogin()">ログイン</button>
  <div class="msg" id="msg"></div>

  <div class="links">
    <a href="/">QuizShareに戻る</a> ・ <a href="/qstart">Qstart</a>
  </div>
</div>
<script>
async function doLogin(){
  var b=document.getElementById('btn'), m=document.getElementById('msg');
  var sid=document.getElementById('sid').value.trim();
  var pw=document.getElementById('pw').value;
  if(!sid||!pw){ m.style.color='#c0392b'; m.textContent='IDとパスワードを入力してください'; return; }
  b.disabled=true; m.style.color='#8a8270'; m.textContent='確認中…';
  try{
    var r=await fetch('/api/staff/login',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({staff_id:sid,password:pw})});
    var d=await r.json();
    if(d.ok){ m.style.color='#2e7d32'; m.textContent='✅ ログインしました'; location.href='/admin'; }
    else { m.style.color='#c0392b'; m.textContent=d.error||'ログインできませんでした'; b.disabled=false; }
  }catch(e){ m.style.color='#c0392b'; m.textContent='通信エラー'; b.disabled=false; }
}
</script></body></html>
