<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロジェクト — Qstart</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  background:#faf9f6; color:#14213d; min-height:100vh; }
.hd { display:flex; align-items:center; gap:12px; padding:14px 22px;
  background:#fff; border-bottom:1px solid #ece9e2; position:sticky; top:0; z-index:10; }
.hd a { color:#14213d; text-decoration:none; font-size:14px; }
.hd .logo { font-size:18px; font-weight:700; } .hd .logo span { color:#b8860b; }
.hd .sp { flex:1; }
.wrap { max-width:1000px; margin:0 auto; padding:26px 22px 60px;
  display:grid; grid-template-columns:1fr 320px; gap:22px; }
@media (max-width:820px){ .wrap{grid-template-columns:1fr;} }
.title { display:flex; align-items:center; gap:11px; margin-bottom:6px; }
.title .ic { font-size:28px; }
.title h1 { font-size:22px; }
.desc { font-size:13.5px; color:#6b6555; line-height:1.7; margin-bottom:20px; }
.box { background:#fff; border:1px solid #ece9e2; border-radius:14px; padding:18px; margin-bottom:14px; }
.box h3 { font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:7px; }
.box h3 .sp { flex:1; }
.chat { padding:12px 13px; border-radius:10px; cursor:pointer; margin-bottom:4px; }
.chat:hover { background:#faf9f5; }
.chat .t { font-size:14px; margin-bottom:3px; }
.chat .d { font-size:11.5px; color:#a09a8a; }
.btn { padding:9px 16px; background:#14213d; color:#fff; border:none;
  border-radius:9px; font-size:13.5px; cursor:pointer; font-family:inherit; }
.btn:hover { background:#1d2d52; }
.btn.gold { background:#b8860b; } .btn.sm { padding:6px 11px; font-size:12px; }
.btn.ghost { background:#fff; color:#14213d; border:1px solid #e0dcd2; }
.btn.red { background:#fff; color:#b03a3a; border:1px solid #e8d0d0; }
textarea { width:100%; padding:11px 13px; border:1px solid #e0dcd2; border-radius:9px;
  font-size:13.5px; font-family:inherit; min-height:130px; line-height:1.65; resize:vertical; }
input[type=text] { width:100%; padding:9px 12px; border:1px solid #e0dcd2;
  border-radius:9px; font-size:14px; font-family:inherit; }
.hint { font-size:11.5px; color:#a09a8a; margin-top:7px; line-height:1.6; }
.empty { text-align:center; padding:34px 12px; color:#a09a8a; font-size:13px; }
.saved { font-size:12px; color:#2e7d32; opacity:0; transition:opacity .3s; }
.saved.show { opacity:1; }
</style>
</head>
<body>

<div class="hd">
  <a class="logo" href="/qstart">Q<span>start</span></a>
  <a href="/qstart/projects">← プロジェクト一覧</a>
  <div class="sp"></div>
  <a href="/qstart"><button class="btn ghost">💬 チャットへ</button></a>
</div>

{% if need_login %}
<div style="text-align:center;padding:80px 20px;color:#a09a8a;">
  <div style="font-size:44px;margin-bottom:14px;">🔒</div>
  <div style="margin-bottom:16px;">ログインが必要です</div>
  <a href="/qstart"><button class="btn">ログインする</button></a>
</div>
{% else %}
<div class="wrap">
  <div>
    <div class="title"><span class="ic" id="pIcon">📁</span><h1 id="pName">読み込み中…</h1></div>
    <div class="desc" id="pDesc"></div>

    <div class="box">
      <h3>💬 チャット<div class="sp"></div>
        <button class="btn gold sm" onclick="newChat()">＋ 新しいチャット</button></h3>
      <div id="chats"><div class="empty">読み込み中…</div></div>
    </div>
  </div>

  <div>
    <div class="box">
      <h3>📝 カスタム指示<div class="sp"></div><span class="saved" id="sv1">保存しました</span></h3>
      <textarea id="pInst" placeholder="このプロジェクト内で、AIにどう振る舞ってほしいか書いてください。&#10;&#10;例: 中学生にもわかるように説明して。専門用語は必ず言い換えを添える。"></textarea>
      <div class="hint">このプロジェクト内のすべてのチャットに適用されます。</div>
      <button class="btn sm" style="margin-top:10px" onclick="saveInst()">保存</button>
    </div>

    <div class="box">
      <h3>⚙️ 設定</h3>
      <div style="font-size:12px;color:#8a8270;margin-bottom:5px;">名前</div>
      <input type="text" id="eName" maxlength="80">
      <div style="font-size:12px;color:#8a8270;margin:12px 0 5px;">説明</div>
      <textarea id="eDesc" style="min-height:70px" maxlength="1000"></textarea>
      <button class="btn sm" style="margin-top:11px" onclick="saveInfo()">保存</button>
    </div>

    <div class="box">
      <h3>🗑 削除</h3>
      <div class="hint" style="margin-top:0;margin-bottom:11px;">プロジェクトを削除しても、中のチャットは残ります。</div>
      <button class="btn red sm" onclick="delProject()">このプロジェクトを削除</button>
    </div>
  </div>
</div>
{% endif %}

<script>
var PID = '{{ pid }}';
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;}
function fmt(s){ if(!s)return''; var d=new Date(s.replace(' ','T'));
  if(isNaN(d))return s.slice(0,10); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function toast(id){ var t=document.getElementById(id); t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},1400); }

async function load(){
  var r = await fetch('/qstart/api/v1/projects/'+PID);
  var d = await r.json();
  if(!d.ok){ document.getElementById('pName').textContent='見つかりません'; return; }
  var p = d.project;
  document.getElementById('pIcon').textContent = p.icon||'\uD83D\uDCC1';
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pDesc').textContent = p.description||'';
  document.getElementById('pInst').value = p.instructions||'';
  document.getElementById('eName').value = p.name||'';
  document.getElementById('eDesc').value = p.description||'';
  document.title = p.name + ' \u2014 Qstart';
  var c = d.chats||[];
  var box = document.getElementById('chats');
  box.innerHTML = '';
  if(!c.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = 'まだチャットがありません<br>「＋ 新しいチャット」から始めましょう';
    box.appendChild(e);
    return;
  }
  c.forEach(function(x){
    var row = document.createElement('div');
    row.className = 'chat';
    row.onclick = function(){ location.href = '/qstart/chat/' + x.chat_id; };
    var t = document.createElement('div'); t.className='t';
    t.textContent = x.title || '無題のチャット';
    var dd = document.createElement('div'); dd.className='d';
    dd.textContent = fmt(x.updated_at);
    row.appendChild(t); row.appendChild(dd);
    box.appendChild(row);
  });
}

async function patch(body, tid){
  var r = await fetch('/qstart/api/v1/projects/'+PID, {method:'PATCH',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  var d = await r.json();
  if(d.ok && tid) toast(tid);
  return d.ok;
}
function saveInst(){ patch({instructions:document.getElementById('pInst').value},'sv1'); }
async function saveInfo(){
  var n = document.getElementById('eName').value.trim();
  if(!n){ alert('名前を入力してください'); return; }
  if(await patch({name:n, description:document.getElementById('eDesc').value})) load();
}
async function delProject(){
  if(!confirm('このプロジェクトを削除しますか？\n中のチャットは残ります。')) return;
  var r = await fetch('/qstart/api/v1/projects/'+PID,{method:'DELETE'});
  var d = await r.json();
  if(d.ok) location.href='/qstart/projects';
}
function newChat(){ location.href = '/qstart?project=' + encodeURIComponent(PID); }

{% if not need_login %}load();{% endif %}
</script>
</body>
</html>
